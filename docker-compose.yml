services:
  postgres:
    image: postgres:16
    container_name: authtrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-authtrace}"
      POSTGRES_USER: "${POSTGRES_USER:-authtrace}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-authtrace}"
      TZ: "${AUTHTRACE_TIMEZONE:-UTC}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authtrace} -d ${POSTGRES_DB:-authtrace}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
    container_name: authtrace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHTRACE_APP_NAME: "${AUTHTRACE_APP_NAME:-AuthTrace API}"
      AUTHTRACE_ENV: "${AUTHTRACE_ENV:-production}"
      AUTHTRACE_DEBUG: "${AUTHTRACE_DEBUG:-false}"
      AUTHTRACE_API_V1_PREFIX: "${AUTHTRACE_API_V1_PREFIX:-/api/v1}"
      AUTHTRACE_CORS_ALLOWED_ORIGINS: "${AUTHTRACE_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      AUTHTRACE_DATABASE_URL: "${AUTHTRACE_DATABASE_URL:-postgresql+psycopg://authtrace:authtrace@postgres:5432/authtrace}"
      AUTHTRACE_TIMEZONE: "${AUTHTRACE_TIMEZONE:-UTC}"
      AUTHTRACE_MANAGEMENT_SOURCE_KEY: "${AUTHTRACE_MANAGEMENT_SOURCE_KEY:-main}"
      AUTHTRACE_MANAGEMENT_SOURCE_NAME: "${AUTHTRACE_MANAGEMENT_SOURCE_NAME:-默认管理端}"
      AUTHTRACE_MANAGEMENT_SOURCE_DESCRIPTION: "${AUTHTRACE_MANAGEMENT_SOURCE_DESCRIPTION:-容器环境默认管理端}"
      AUTHTRACE_MANAGEMENT_BASE_URL: "${AUTHTRACE_MANAGEMENT_BASE_URL:-}"
      AUTHTRACE_MANAGEMENT_TOKEN: "${AUTHTRACE_MANAGEMENT_TOKEN:-}"
      AUTHTRACE_MANAGEMENT_TIMEOUT_SECONDS: "${AUTHTRACE_MANAGEMENT_TIMEOUT_SECONDS:-30}"
      AUTHTRACE_MANAGEMENT_REQUEST_RETRIES: "${AUTHTRACE_MANAGEMENT_REQUEST_RETRIES:-2}"
      AUTHTRACE_MANAGEMENT_RETRY_BACKOFF_SECONDS: "${AUTHTRACE_MANAGEMENT_RETRY_BACKOFF_SECONDS:-1}"
      AUTHTRACE_MANAGEMENT_PROBE_CONCURRENCY: "${AUTHTRACE_MANAGEMENT_PROBE_CONCURRENCY:-4}"
      AUTHTRACE_SCHEDULER_ENABLED: "${AUTHTRACE_SCHEDULER_ENABLED:-true}"
      AUTHTRACE_SCHEDULER_INTERVAL_MINUTES: "${AUTHTRACE_SCHEDULER_INTERVAL_MINUTES:-15}"
      AUTHTRACE_MANAGEMENT_USER_AGENT: "${AUTHTRACE_MANAGEMENT_USER_AGENT:-AuthTrace/0.1 (+https://local.authtrace)}"
      AUTHTRACE_MANAGEMENT_TARGET_TYPE: "${AUTHTRACE_MANAGEMENT_TARGET_TYPE:-}"
      AUTHTRACE_MANAGEMENT_PROVIDER: "${AUTHTRACE_MANAGEMENT_PROVIDER:-}"
      AUTHTRACE_MANAGEMENT_WEEKLY_QUOTA_THRESHOLD: "${AUTHTRACE_MANAGEMENT_WEEKLY_QUOTA_THRESHOLD:-95}"
      AUTHTRACE_MANAGEMENT_SHORT_QUOTA_THRESHOLD: "${AUTHTRACE_MANAGEMENT_SHORT_QUOTA_THRESHOLD:-95}"
      AUTHTRACE_DB_WAIT_ATTEMPTS: "${AUTHTRACE_DB_WAIT_ATTEMPTS:-30}"
      AUTHTRACE_DB_WAIT_INTERVAL_SECONDS: "${AUTHTRACE_DB_WAIT_INTERVAL_SECONDS:-2}"
    ports:
      - "${AUTHTRACE_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    build:
      context: ./frontend
    container_name: authtrace-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${AUTHTRACE_PUBLIC_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
